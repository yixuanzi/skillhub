version: '3.8'

services:
  skillhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillhub-all-in-one
    ports:
      # Port 80 serves frontend (nginx) and proxies API to backend
      - "80:80"
      # Port 8000 for direct backend access (optional)
      - "8000:8000"
    environment:
      # Server Configuration
      - SKILL_HOST=0.0.0.0
      - SKILL_PORT=8000
      - SKILLHUB_URL=http://localhost:80

      # Database Configuration
      - DATABASE_URL=sqlite:///./data/skillhub.db

      # Security (CHANGE IN PRODUCTION!)
      - SECRET_KEY=your-secret-key-change-in-production

      # CORS Origins
      - CORS_ORIGINS=["http://localhost","http://localhost:80"]
      # Aegis Portal OIDC client configuration. Keep the secret in a local
      # untracked .env file or an external runtime secret store.
      - OIDC_ISSUER=${OIDC_ISSUER:-http://127.0.0.1:8080}
      - OIDC_BACKCHANNEL_URL=${OIDC_BACKCHANNEL_URL:-http://host.docker.internal:8000}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://127.0.0.1/api/v1/sso/callback}
      - OIDC_POST_LOGIN_REDIRECT=${OIDC_POST_LOGIN_REDIRECT:-/sso/callback}
      - OIDC_SECURE_COOKIE=${OIDC_SECURE_COOKIE:-false}
      
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    volumes:
      # Persist SQLite database and logs
      - ./backend:/app
      #- ./backend/data:/app/data
      # - skillhub-logs:/var/log/supervisor

      # Optional: Mount for development (comment out in production)
      # - ./backend:/app/backend:ro
      # - ./frontend:/frontend:ro

    restart: unless-stopped

    networks:
      - skillhub-network

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  skillhub-data:
    driver: local
  # skillhub-logs:
  #   driver: local

networks:
  skillhub-network:
    driver: bridge
